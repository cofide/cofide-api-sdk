version: v2
# Delete each plugin's output directory before generating, so that code for
# protos that were removed or renamed doesn't linger.
clean: true
plugins:
  # The Go plugins are pinned as tools in tools/go.mod, so that everyone
  # generates the same code, including the proto-gen check in CI.

  # Go
  - local: ["go", "-C", "tools", "tool", "protoc-gen-go"]
    out: gen/go/
    opt:
      - paths=source_relative

  # Go ConnectRPC
  - local: ["go", "-C", "tools", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt:
      - paths=source_relative

  # Go gRPC
  - local: ["go", "-C", "tools", "tool", "protoc-gen-go-grpc"]
    out: gen/go/
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # TypeScript
  - remote: buf.build/bufbuild/es:v2.2.3
    out: gen/ts/
    opt:
      - target=ts
    include_imports: true
