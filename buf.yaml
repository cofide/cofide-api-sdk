version: v2
modules:
  # The old APIs. This module is rooted at the repo, so their file names and
  # packages start with proto.
  - path: .
    excludes:
      - proto/cofide
      - node_modules
  # The new APIs, under proto/cofide. This module is rooted at proto/, so their
  # file names and packages start with cofide. They are imported as
  # cofide/<name>/<version>/<file>.proto, without the proto/ prefix.
  - path: proto
    includes:
      - proto/cofide
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  disallow_comment_ignores: true
  ignore_only:
    # Ignore some rules for files copied from spire-api-sdk.
    PACKAGE_DIRECTORY_MATCH:
      - "proto/spire/api/types/bundle.proto"
      - "proto/spire/api/types/selector.proto"
    PACKAGE_VERSION_SUFFIX:
      - "proto/spire/api/types/bundle.proto"
      - "proto/spire/api/types/selector.proto"
breaking:
  use:
    - FILE
