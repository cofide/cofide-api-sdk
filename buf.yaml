version: v2
modules:
  # The old APIs. This module is rooted at the repo, so their file names and
  # packages start with proto. Only proto/ is included, so other directories
  # such as node_modules are ignored.
  - path: .
    includes:
      - proto
    excludes:
      - proto/cofide
  # The new APIs, under proto/cofide. This module is rooted at proto/, so their
  # file names and packages start with cofide. They are imported as
  # cofide/<name>/<version>/<file>.proto, without the proto/ prefix.
  - path: proto
    includes:
      - proto/cofide
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
    # From buf-plugin-cofide, below.
    - GO_IDENT_CLASH
  disallow_comment_ignores: true
  ignore_only:
    # Ignore some rules for files copied from spire-api-sdk.
    PACKAGE_DIRECTORY_MATCH:
      - "proto/spire/api/types/bundle.proto"
      - "proto/spire/api/types/selector.proto"
    PACKAGE_VERSION_SUFFIX:
      - "proto/spire/api/types/bundle.proto"
      - "proto/spire/api/types/selector.proto"
breaking:
  use:
    - FILE
plugins:
  # Cofide's own lint rules, from tools/cmd/buf-plugin-cofide. buf runs check
  # plugins with an empty environment, in which go tool can't find the module
  # cache, so just buf-plugin builds the plugin into bin/ first.
  - plugin: bin/buf-plugin-cofide
