// This file defines the Workload message and related types representing
// processes and containers observed by Cofide Observer on attested nodes.
// Workload data is streamed to the Connect control plane and used to match
// workloads against attestation policies for SPIFFE identity issuance.
syntax = "proto3";

package proto.workload.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "proto/exchange_policy/v1alpha1/exchange_policy.proto";
import "proto/identity/v1alpha1/identity.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/proto/workload/v1alpha1";

// Workload represents a process, container, or unit of software running on an
// attested node. Workloads are observed by the Cofide Observer and reported to the
// Connect control plane. A SPIFFE identity (SVID) can be issued to a workload
// if it matches an active attestation policy binding within its trust zone.
message Workload {
  string id = 1;
  string org_id = 4;
  // Deprecated: use trust_zone_ids to determine trust zone membership. For a Kubernetes pod
  // workload this remains the cluster's trust zone (mirrored into trust_zone_ids); for other
  // workload types (e.g. a Lambda function) this is always empty — membership is derived from
  // attestation policy bindings instead.
  string trust_zone_id = 2 [deprecated = true];
  // The cluster this workload runs in. Empty for workload types that are not
  // bound to a specific cluster (e.g. a Lambda function), and for workloads
  // not yet assigned to a trust zone.
  string cluster_id = 3;
  WorkloadType type = 9;
  oneof workload {
    KubernetesPod kubernetes_pod = 5;
    LambdaFunctionWorkload lambda_function = 11;
    AgentcoreWorkloadWorkload agentcore_workload = 15;
  }
  // Security posture observations.
  repeated Observation observations = 6;
  // When this workload was last observed by the Cofide Observer.
  google.protobuf.Timestamp observed_timestamp = 7;
  // Whether this workload has been deleted since it was last observed.
  bool deleted = 8;
  // Whether this workload currently matches an enabled WorkloadSuppressionRule
  // scoped to it. Computed dynamically against the current rule set at query
  // time rather than stored, so it reflects rule state as of the request, not
  // the observation. Only populated in ListWorkloads responses; workloads
  // reported via PublishWorkloads should leave it unset.
  bool suppressed = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The trust zones this workload currently has (or could obtain) a SPIFFE identity in. For a
  // Kubernetes pod this mirrors trust_zone_id. For a Lambda function or AgentCore Runtime workload
  // this is computed dynamically at query time by matching the workload's IAM role ARN against
  // static AttestationPolicy selectors and following their APBindings — a single workload can
  // match policies bound to multiple trust zones, since Credex can exchange the same token for a
  // JWT SVID in any trust zone with a matching binding. Only populated in ListWorkloads responses;
  // workloads reported via PublishWorkloads should leave it unset.
  repeated string trust_zone_ids = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Deprecated: use identities instead, which carries the actual granted SPIFFE ID rather than
  // just the policy ID.
  repeated string matching_attestation_policy_ids = 13 [
    deprecated = true,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  // The identities this workload has (Kubernetes pod, exact match) or could obtain (Lambda
  // function or AgentCore Runtime workload, via Credex) from a matched, trust-zone-bound
  // AttestationPolicy. For a Kubernetes pod, only identities derived from policies bound to the
  // pod's own cluster's trust zone are considered (kubernetes-kind, matched via namespace/pod
  // label selectors; or static-kind, matched via k8s:* selectors per the SPIRE k8s workload
  // attestor plugin — ns, sa, pod-uid, pod-name, node-name, pod-label, container-name,
  // container-image; other k8s:* selector kinds cannot be verified from discovered data and are
  // treated as non-matching). For a Lambda function or AgentCore Runtime workload, every
  // static-kind policy bound to any trust zone is considered, matched via a credex selector on the
  // workload's IAM role ARN. Only populated in ListWorkloads responses; workloads reported via
  // PublishWorkloads should leave it unset.
  repeated proto.identity.v1alpha1.Identity identities = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // ExchangePolicy records matching this workload's native cloud-issued identity token
  // (independently of any SPIFFE identity granted via AttestationPolicy/Credex JWT-SVID
  // delegation — see identities), computed dynamically at query time by matching the workload's
  // IAM role ARN and its cloud account's outbound web identity federation issuer against each
  // policy's subject_identity/subject_issuer. Only populated in ListWorkloads responses for
  // Lambda function and AgentCore Runtime workloads; workloads reported via PublishWorkloads
  // should leave it unset.
  repeated ExchangePolicyEligibility exchange_policy_eligibilities = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ExchangePolicyEligibility describes an ExchangePolicy that matches a Lambda function's or
// AgentCore Runtime workload's native cloud-issued identity token via Credex's RFC 8693 OAuth
// token exchange. This is a separate mechanism from SPIFFE identity issuance: a successful
// exchange yields an OAuth access token (outbound_identity), not a SPIFFE SVID.
message ExchangePolicyEligibility {
  string exchange_policy_id = 1;
  string exchange_policy_name = 2;
  string trust_zone_id = 3;
  proto.exchange_policy.v1alpha1.ExchangePolicyAction action = 4;
  // The identity Credex would mint on a successful exchange. Only set when action is ALLOW.
  string outbound_identity = 5;
}

// WorkloadType enumerates the supported workload runtime types.
enum WorkloadType {
  WORKLOAD_TYPE_UNSPECIFIED = 0;
  WORKLOAD_TYPE_KUBERNETES_POD = 1;
  WORKLOAD_TYPE_LAMBDA_FUNCTION = 2;
  WORKLOAD_TYPE_AGENTCORE_WORKLOAD = 3;
}

// Observation is a structured data point describing the security posture of
// the workload.
message Observation {
  string type_url = 1;
  google.protobuf.Value value = 2;
}

// KubernetesPod contains the runtime details of a Kubernetes pod workload
// as observed by the Cofide Observer via the kubelet API.
message KubernetesPod {
  KubernetesMetadata metadata = 1;
  string service_account_name = 2;
  string node_name = 3;
  string node_uid = 6;
  repeated KubernetesContainer containers = 4;
  google.protobuf.Timestamp start_time = 5;
}

// KubernetesMetadata contains standard Kubernetes object metadata for a workload.
message KubernetesMetadata {
  string uid = 1;
  string name = 2;
  string namespace = 3;
  map<string, string> labels = 4;
  map<string, string> annotations = 5;
  google.protobuf.Timestamp creation_timestamp = 6;
}

// KubernetesContainer describes a single container within a Kubernetes pod workload.
message KubernetesContainer {
  string name = 1;
  string image = 2;
}

// LambdaFunctionWorkload contains the runtime details of an AWS Lambda function
// workload as discovered by Connect's cloud resource discovery.
message LambdaFunctionWorkload {
  string function_name = 1;
  string function_arn = 2;
  string region = 3;
  string iam_role_arn = 4;
  // The cloud account this function was discovered in, for traceability back
  // to the discovery source.
  string cloud_account_id = 5;
  // AWS resource tags on this Lambda function, as returned by lambda:ListTags. Used as
  // suppression-rule selectors via LambdaFunctionMatcher.tags.
  map<string, string> tags = 6;
}

// AgentcoreWorkloadWorkload contains the runtime details of an AWS Bedrock AgentCore Runtime
// workload as discovered by Connect's cloud resource discovery.
message AgentcoreWorkloadWorkload {
  string agent_runtime_name = 1;
  string agent_runtime_arn = 2;
  string region = 3;
  // The IAM role ARN used for Credex/OIDC attestation-policy matching, mirroring
  // LambdaFunctionWorkload.iam_role_arn. See workload_identity_arn for the alternative AWS
  // exposes for this purpose — matching uses this field until verified otherwise.
  string role_arn = 4;
  // AWS's dedicated workload-identity ARN for this runtime. Captured but not currently used for
  // matching; see role_arn.
  string workload_identity_arn = 5;
  // The cloud account this runtime was discovered in, for traceability back to the discovery
  // source.
  string cloud_account_id = 6;
}
