// This file defines the ClusterSuppressionRule message and related types used
// to hide discovered clusters from the Connect clusters view. Rules can be
// scoped to an organization, a trust zone, or a single cluster; a cluster is
// suppressed if it matches any enabled rule whose scope applies to it.
// Suppression is evaluated dynamically at query time by
// ClusterService.ListClusters and is not persisted on the Cluster itself.
syntax = "proto3";

package proto.cluster_suppression_rule.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "proto/attestation_policy/v1alpha1/attestation_policy.proto";
import "proto/exchange_policy/v1alpha1/exchange_policy.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/proto/cluster_suppression_rule/v1alpha1";

// ClusterSuppressionRule defines a rule that hides matching clusters from the
// Connect clusters view. A rule scoped to only an org_id applies to every
// cluster in the organization; a rule that also sets trust_zone_id and/or
// cluster_id applies only to clusters within that trust zone/cluster. The
// effective suppression for a cluster is the union of every enabled rule
// whose scope applies to it — a cluster is suppressed if it matches ANY of
// them.
message ClusterSuppressionRule {
  // Unique identifier for the rule. Generated by the server, prefixed with "csr-".
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Cofide organization this rule belongs to.
  string org_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Restricts the rule to clusters within this trust zone. Leave unset for a
  // rule that applies across all trust zones (subject to cluster_id).
  optional string trust_zone_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // Restricts the rule to a single cluster. Leave unset for a rule that
  // applies across all clusters (subject to trust_zone_id).
  optional string cluster_id = 4 [(google.api.field_behavior) = OPTIONAL];
  // Human-readable name for the rule.
  string name = 5 [(google.api.field_behavior) = REQUIRED];
  // Human-readable explanation of why the rule exists.
  optional string description = 6 [(google.api.field_behavior) = OPTIONAL];
  // Whether the rule is currently active. Disabled rules are retained but have
  // no suppression effect.
  bool enabled = 7 [(google.api.field_behavior) = OPTIONAL];
  // Match criteria. Which arm is populated determines which clusters are
  // eligible to match — e.g. a cluster only matches the aws_eks matcher if
  // its proto.cluster.v1alpha1.Cluster.external_provider.aws_eks is set.
  oneof matcher {
    AWSEKSClusterMatcher aws_eks = 8;
  }
  // Time of resource creation.
  google.protobuf.Timestamp created_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of last resource update.
  google.protobuf.Timestamp last_updated_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AWSEKSClusterMatcher matches clusters discovered via AWS EKS cloud resource
// discovery (proto.cluster.v1alpha1.Cluster with external_provider.aws_eks
// set) by region, cluster name, cloud account, and/or tags. When multiple
// fields are set, a cluster must satisfy ALL of them to match (AND
// semantics). An unset/empty field matches anything.
message AWSEKSClusterMatcher {
  // Matches proto.cluster.v1alpha1.AWSEKSProvider.region. Matchers within the
  // set are evaluated with OR semantics. Unset/empty matches any region.
  proto.exchange_policy.v1alpha1.StringSet region = 1 [(google.api.field_behavior) = OPTIONAL];
  // Matches the top-level proto.cluster.v1alpha1.Cluster.name (there is no
  // separate name field on AWSEKSProvider). Matchers within the set are
  // evaluated with OR semantics. Unset/empty matches any name.
  proto.exchange_policy.v1alpha1.StringSet cluster_name = 2 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.cluster.v1alpha1.AWSEKSProvider.cloud_account_id. Matchers
  // within the set are evaluated with OR semantics. Unset/empty matches any
  // cloud account.
  proto.exchange_policy.v1alpha1.StringSet cloud_account_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.cluster.v1alpha1.AWSEKSProvider.tags. Unset/empty matches
  // any tags.
  proto.attestation_policy.v1alpha1.APLabelSelector tags = 4 [(google.api.field_behavior) = OPTIONAL];
}
