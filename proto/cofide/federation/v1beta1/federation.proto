// This file defines the Federation message, which represents a trust
// relationship between two trust zones.

syntax = "proto3";

package cofide.federation.v1beta1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/cofide/federation/v1beta1";

// Federation represents a trust relationship between one trust zone and
// another. It allows workloads in the local trust zone to establish trust
// with workloads in the remote trust zone, while keeping each zone's root of
// trust isolated. Attestation policies determine which workloads are permitted
// to federate.
//
// Both trust zones must belong to the same organization, and a trust zone
// cannot federate with itself. The relationship is unidirectional, so a
// federation from A to B is distinct from one from B to A, and both are needed
// to establish trust in each direction.
message Federation {
  // Unique identifier for the federation. Generated by Connect.
  string id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // ID of the Cofide organization this federation belongs to. Set by Connect
  // from the local trust zone.
  string org_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The local trust zone that trusts the remote trust zone.
  string trust_zone_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // What the local trust zone trusts. Exactly one must be set. Only trust
  // zones can be trusted for now.
  oneof remote {
    // The remote trust zone that is trusted by the local trust zone.
    string remote_trust_zone_id = 4 [(google.api.field_behavior) = IMMUTABLE];
  }
  // Time of resource creation. Unset if Connect has not recorded it.
  google.protobuf.Timestamp created_at = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Time of last resource update. Unset if Connect has not recorded it.
  google.protobuf.Timestamp last_updated_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}
