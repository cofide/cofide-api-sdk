// This file defines the Organization message, the top-level grouping of
// Connect resources.

syntax = "proto3";

package cofide.organization.v1beta1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/cofide/organization/v1beta1";

// Organization is the top-level grouping of Connect resources. Trust zones,
// and the resources within them, belong to an organization.
//
// Organizations are currently managed by Connect rather than through the API,
// which provides read-only access to them.
message Organization {
  // Unique identifier for the organization. Generated by Connect.
  string id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Name of the organization. Unique within Connect.
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  // Time of resource creation. Unset if Connect has not recorded it.
  google.protobuf.Timestamp created_at = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Time of last resource update. Unset if Connect has not recorded it.
  google.protobuf.Timestamp last_updated_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}
