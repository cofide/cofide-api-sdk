// This file defines the CloudDiscoveryConfigService gRPC service for
// managing cloud discovery configs in the Connect control plane. A
// cloud discovery config configures discovery of resources, such as
// workloads, within a cloud account linked to a Cofide organization.

syntax = "proto3";

package cofide.cloud_discovery_config.v1alpha1;

import "cofide/cloud_discovery_config/v1alpha1/discovery.proto";
import "cofide/common/pagination/v1beta1/pagination.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/cofide/cloud_discovery_config/v1alpha1";

// CloudDiscoveryConfigService manages cloud discovery configs in the Connect control plane.
service CloudDiscoveryConfigService {
  // CreateCloudDiscoveryConfig creates a cloud discovery config within a cloud account.
  rpc CreateCloudDiscoveryConfig(CreateCloudDiscoveryConfigRequest) returns (CreateCloudDiscoveryConfigResponse);
  // GetCloudDiscoveryConfig retrieves a cloud discovery config by ID.
  rpc GetCloudDiscoveryConfig(GetCloudDiscoveryConfigRequest) returns (GetCloudDiscoveryConfigResponse);
  // ListCloudDiscoveryConfigs returns all cloud discovery configs matching the optional filter.
  rpc ListCloudDiscoveryConfigs(ListCloudDiscoveryConfigsRequest) returns (ListCloudDiscoveryConfigsResponse);
  // UpdateCloudDiscoveryConfig updates an existing cloud discovery config.
  rpc UpdateCloudDiscoveryConfig(UpdateCloudDiscoveryConfigRequest) returns (UpdateCloudDiscoveryConfigResponse);
  // DeleteCloudDiscoveryConfig deletes a cloud discovery config by ID.
  rpc DeleteCloudDiscoveryConfig(DeleteCloudDiscoveryConfigRequest) returns (DeleteCloudDiscoveryConfigResponse);
}

// CreateCloudDiscoveryConfigRequest is the request for CreateCloudDiscoveryConfig.
message CreateCloudDiscoveryConfigRequest {
  // The cloud discovery config to create.
  CloudDiscoveryConfig cloud_discovery_config = 1 [(google.api.field_behavior) = REQUIRED];
}

// CreateCloudDiscoveryConfigResponse is the response from CreateCloudDiscoveryConfig.
message CreateCloudDiscoveryConfigResponse {
  // The created cloud discovery config.
  CloudDiscoveryConfig cloud_discovery_config = 1;
}

// GetCloudDiscoveryConfigRequest is the request for GetCloudDiscoveryConfig.
message GetCloudDiscoveryConfigRequest {
  // ID of the cloud discovery config to retrieve.
  string cloud_discovery_config_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetCloudDiscoveryConfigResponse is the response from GetCloudDiscoveryConfig.
message GetCloudDiscoveryConfigResponse {
  // The requested cloud discovery config.
  CloudDiscoveryConfig cloud_discovery_config = 1;
}

// ListCloudDiscoveryConfigsRequest is the request for ListCloudDiscoveryConfigs.
message ListCloudDiscoveryConfigsRequest {
  // Filter restricts which cloud discovery configs are returned. It has no
  // fields yet, so every cloud discovery config matches.
  message Filter {}
  // Restricts which cloud discovery configs are returned.
  Filter filter = 1 [(google.api.field_behavior) = OPTIONAL];
  // The page of results to return.
  cofide.common.pagination.v1beta1.PageRequest pagination = 2 [(google.api.field_behavior) = OPTIONAL];
}

// ListCloudDiscoveryConfigsResponse is the response from ListCloudDiscoveryConfigs.
message ListCloudDiscoveryConfigsResponse {
  // The cloud discovery configs in this page of results.
  repeated CloudDiscoveryConfig cloud_discovery_configs = 1;
  // How to retrieve the next page of results.
  cofide.common.pagination.v1beta1.PageResponse pagination = 2;
}

// UpdateCloudDiscoveryConfigRequest is the request for UpdateCloudDiscoveryConfig.
message UpdateCloudDiscoveryConfigRequest {
  // The cloud discovery config to update, identified by its ID, with the
  // new values of the fields to update.
  CloudDiscoveryConfig cloud_discovery_config = 1 [(google.api.field_behavior) = REQUIRED];
  // The list of fields to be updated. If not provided a full replacement of all updatable fields will be made.
  // The update mask should align with the type being updated.
  oneof update_mask {
    // The fields to update in an AWS Lambda discovery config.
    AwsLambdaDiscoveryConfigUpdateMask aws_lambda_discovery_config_update_mask = 2;
    // The fields to update in an AWS AgentCore discovery config.
    AwsAgentCoreDiscoveryConfigUpdateMask aws_agent_core_discovery_config_update_mask = 3;
  }
}

// AwsLambdaDiscoveryConfigUpdateMask selects the fields of an AWS Lambda
// discovery config to update.
message AwsLambdaDiscoveryConfigUpdateMask {
  // Set to true to update the name field.
  bool name = 1 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the disabled field.
  bool disabled = 2 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the discovery_interval field.
  bool discovery_interval = 3 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the regions field.
  bool regions = 4 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the assume through OIDC field on the assume role config.
  bool assume_through_oidc = 5 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the audience field on the assume role config.
  bool audience = 6 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the roles field on the assume role config.
  bool roles = 7 [(google.api.field_behavior) = OPTIONAL];
}

// AwsAgentCoreDiscoveryConfigUpdateMask selects the fields of an AWS
// AgentCore discovery config to update.
message AwsAgentCoreDiscoveryConfigUpdateMask {
  // Set to true to update the name field.
  bool name = 1 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the disabled field.
  bool disabled = 2 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the discovery_interval field.
  bool discovery_interval = 3 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the regions field.
  bool regions = 4 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the assume through OIDC field on the assume role config.
  bool assume_through_oidc = 5 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the audience field on the assume role config.
  bool audience = 6 [(google.api.field_behavior) = OPTIONAL];
  // Set to true to update the roles field on the assume role config.
  bool roles = 7 [(google.api.field_behavior) = OPTIONAL];
}

// UpdateCloudDiscoveryConfigResponse is the response from UpdateCloudDiscoveryConfig.
message UpdateCloudDiscoveryConfigResponse {
  // The updated cloud discovery config.
  CloudDiscoveryConfig cloud_discovery_config = 1;
}

// DeleteCloudDiscoveryConfigRequest is the request for DeleteCloudDiscoveryConfig.
message DeleteCloudDiscoveryConfigRequest {
  // ID of the cloud discovery config to delete.
  string cloud_discovery_config_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteCloudDiscoveryConfigResponse is the response from DeleteCloudDiscoveryConfig.
message DeleteCloudDiscoveryConfigResponse {}
