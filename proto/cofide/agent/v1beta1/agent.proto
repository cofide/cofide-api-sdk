// This file defines the Agent message and related types representing a Cofide
// Agent and the status it reports to the Connect control plane.

syntax = "proto3";

package cofide.agent.v1beta1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/cofide/agent/v1beta1";

// Agent represents a Cofide Agent deployed in a cluster. The agent facilitates
// cluster registration with the Connect control plane and provides dynamic
// control plane functionality including federated service management.
//
// Connect creates an agent when it registers from a cluster, with at most one
// agent per cluster, so all of its fields are output only.
message Agent {
  // Unique identifier for the agent. Generated by Connect.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Cofide organization ID the agent belongs to: that of its cluster.
  string org_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The cluster the agent runs in.
  string cluster_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The trust zone of the agent's cluster.
  string trust_zone_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The status the agent last reported. Unset if it has not reported one.
  AgentStatus status = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of resource creation.
  google.protobuf.Timestamp created_at = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Time of last resource update.
  google.protobuf.Timestamp last_updated_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AgentStatus reports the current operational status of a Cofide Agent.
message AgentStatus {
  AgentStatusCode status = 1 [(google.api.field_behavior) = REQUIRED];
  // A human-readable description of the status, e.g. the cause of an error.
  string status_message = 2 [(google.api.field_behavior) = OPTIONAL];
  // Time Connect received the status.
  google.protobuf.Timestamp updated_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AgentStatusCode enumerates the possible operational states of a Cofide Agent.
enum AgentStatusCode {
  AGENT_STATUS_CODE_UNSPECIFIED = 0;
  AGENT_STATUS_CODE_RUNNING = 1;
  AGENT_STATUS_CODE_STOPPED = 2;
  AGENT_STATUS_CODE_ERROR = 3;
  AGENT_STATUS_CODE_STARTING = 4;
}
