// This file defines the IdentityService gRPC service, which provides
// read-only access to the SPIFFE identities Connect issues to workloads.

syntax = "proto3";

package cofide.identity.v1beta1;

import "cofide/common/pagination/v1beta1/pagination.proto";
import "cofide/identity/v1beta1/identity.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/cofide/identity/v1beta1";

// IdentityService provides read-only access to the SPIFFE identities that
// Connect issues to workloads.
service IdentityService {
  // GetIdentity retrieves an identity by ID.
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  // ListIdentities returns all identities matching the optional filter.
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
}

// GetIdentityRequest is the request for GetIdentity.
message GetIdentityRequest {
  // ID of the identity to retrieve.
  string identity_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetIdentityResponse is the response from GetIdentity.
message GetIdentityResponse {
  // The requested identity.
  Identity identity = 1;
}

// ListIdentitiesRequest is the request for ListIdentities.
message ListIdentitiesRequest {
  // Filter restricts the identities returned. Each field matches identities
  // with any of the given values, and identities must match every field that
  // is set.
  message Filter {
    // Return only identities belonging to one of these organizations.
    repeated string org_ids = 1 [(google.api.field_behavior) = OPTIONAL];
    // Return only identities issued in one of these trust zones.
    repeated string trust_zone_ids = 2 [(google.api.field_behavior) = OPTIONAL];
    // Return only identities issued in one of these clusters.
    repeated string cluster_ids = 3 [(google.api.field_behavior) = OPTIONAL];
    // Return only identities derived from one of these attestation policies.
    repeated string attestation_policy_ids = 4 [(google.api.field_behavior) = OPTIONAL];
    // Return only identities issued to one of these workloads.
    repeated string workload_ids = 5 [(google.api.field_behavior) = OPTIONAL];
    // Return only identities with one of these SPIFFE IDs.
    repeated string spiffe_ids = 6 [(google.api.field_behavior) = OPTIONAL];
  }
  // Restricts which identities are returned.
  Filter filter = 1 [(google.api.field_behavior) = OPTIONAL];
  // The page of results to return.
  cofide.common.pagination.v1beta1.PageRequest pagination = 2 [(google.api.field_behavior) = OPTIONAL];
}

// ListIdentitiesResponse is the response from ListIdentities.
message ListIdentitiesResponse {
  // The identities in this page of results.
  repeated Identity identities = 1;
  // How to retrieve the next page of results.
  cofide.common.pagination.v1beta1.PageResponse pagination = 2;
}
