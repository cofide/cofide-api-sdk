// This file defines the general discovery status used across all discovery of
// resources within cloud accounts.

syntax = "proto3";

package proto.cloud_account.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "proto/cloud_account/v1alpha1/aws_resource_discovery.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/proto/cloud_account/v1alpha1";

// DiscoveryStatus represents the current status of cloud resource discovery.
enum DiscoveryStatus {
  DISCOVERY_STATUS_UNSPECIFIED = 0;
  // Discvoery is active
  DISCOVERY_STATUS_DISCOVERING = 1;
  // Most recent discovery attempt errored
  DISCOVERY_STATUS_ERROR = 2;
}

// CloudAccount represents a cloud resource discovery config linked to a cloud account.
message CloudResourceDiscovery {
  // Unique identifier for the cloud resource discovery config. Generated by Connect.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Cloud account ID this resource discovery config belongs to.
  string cloud_account_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Human-readable name for the cloud resource discovery config within Connect.
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  // Whether discovery is disabled using this config.
  bool disabled = 4 [(google.api.field_behavior) = OPTIONAL];
  // How frequently discovery runs for this config (e.g. every minute).
  google.protobuf.Duration discovery_interval = 5 [(google.api.field_behavior) = OPTIONAL];
  // Cloud provider-specific configuration.
  oneof discovery_config {
    AWSLambdaDiscoveryConfig aws_lambda_discovery_config = 6;
    AWSAgentCoreDiscoveryConfig aws_agent_core_discovery_config = 7;
  }
  // Current discovery status.
  DiscoveryStatus status = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp of the last successful discovery run.
  google.protobuf.Timestamp last_successful_discovery = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp of the last status update.
  google.protobuf.Timestamp status_last_updated_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of resource creation.
  google.protobuf.Timestamp created_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of last resource update.
  google.protobuf.Timestamp last_updated_at = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}
