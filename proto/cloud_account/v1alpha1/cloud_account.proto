// This file defines the CloudAccount message and related types used to
// represent a cloud provider account linked to a Cofide organization.

syntax = "proto3";

package proto.cloud_account.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "proto/cloud_provider/v1alpha1/cloud_provider.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/proto/cloud_account/v1alpha1";

// AWSAccount contains AWS-specific configuration for a cloud account.
message AWSAccount {
  // 12-digit AWS account ID.
  string account_id = 1 [(google.api.field_behavior) = REQUIRED];
  AWSLambdaDiscoveryConfig lambda_discovery_config = 2 [(google.api.field_behavior) = OPTIONAL];
  AWSAgentCoreDiscoveryConfig agent_core_discovery_config = 3 [(google.api.field_behavior) = OPTIONAL];
}

// AWSLambdaDiscoveryConfig contains configuration for Lambda function discovery.
message AWSLambdaDiscoveryConfig {
  // Audience value for the initial SPIFFE JWT-based assume role call.
  // Only used when assume_through_oidc is true.
  string audience = 1 [(google.api.field_behavior) = REQUIRED];
  // AWS regions to discover resources in.
  repeated string regions = 2 [(google.api.field_behavior) = OPTIONAL];
  // Whether discovery is enabled for this config.
  bool discovery_enabled = 3 [(google.api.field_behavior) = OPTIONAL];
  // Current discovery status.
  proto.cloud_provider.v1alpha1.DiscoveryStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp of the last successful discovery run.
  google.protobuf.Timestamp last_successful_discovery = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp of the last status update.
  google.protobuf.Timestamp status_last_updated_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Ordered chain of IAM roles to assume. When assume_through_oidc is true, the
  // first role is assumed via AssumeRoleWithWebIdentity using the SPIFFE JWT;
  // when false, the first role is assumed via plain AssumeRole using ambient
  // credentials (e.g. EKS Pod Identity). Each subsequent role is always assumed
  // using the credentials from the prior step.
  repeated proto.cloud_provider.v1alpha1.AWSAssumeRoleConfig role_chain = 7 [(google.api.field_behavior) = REQUIRED];
  // How frequently discovery runs for this config (e.g. every minute).
  google.protobuf.Duration discovery_interval = 8 [(google.api.field_behavior) = OPTIONAL];
  // Whether the first role in role_chain is assumed via SPIFFE JWT-based
  // AssumeRoleWithWebIdentity (true, the default) or via ambient credentials
  // such as EKS Pod Identity (false).
  bool assume_through_oidc = 9 [(google.api.field_behavior) = OPTIONAL];
}

// AWSAgentCoreDiscoveryConfig contains configuration for Amazon Bedrock AgentCore Runtime discovery.
message AWSAgentCoreDiscoveryConfig {
  // Audience value for the initial SPIFFE JWT-based assume role call.
  // Only used when assume_through_oidc is true.
  string audience = 1 [(google.api.field_behavior) = REQUIRED];
  // AWS regions to discover resources in.
  repeated string regions = 2 [(google.api.field_behavior) = OPTIONAL];
  // Whether discovery is enabled for this config.
  bool discovery_enabled = 3 [(google.api.field_behavior) = OPTIONAL];
  // Current discovery status.
  proto.cloud_provider.v1alpha1.DiscoveryStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp of the last successful discovery run.
  google.protobuf.Timestamp last_successful_discovery = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp of the last status update.
  google.protobuf.Timestamp status_last_updated_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Ordered chain of IAM roles to assume. When assume_through_oidc is true, the
  // first role is assumed via AssumeRoleWithWebIdentity using the SPIFFE JWT;
  // when false, the first role is assumed via plain AssumeRole using ambient
  // credentials (e.g. EKS Pod Identity). Each subsequent role is always assumed
  // using the credentials from the prior step.
  repeated proto.cloud_provider.v1alpha1.AWSAssumeRoleConfig role_chain = 7 [(google.api.field_behavior) = REQUIRED];
  // How frequently discovery runs for this config (e.g. every minute).
  google.protobuf.Duration discovery_interval = 8 [(google.api.field_behavior) = OPTIONAL];
  // Whether the first role in role_chain is assumed via SPIFFE JWT-based
  // AssumeRoleWithWebIdentity (true, the default) or via ambient credentials
  // such as EKS Pod Identity (false).
  bool assume_through_oidc = 9 [(google.api.field_behavior) = OPTIONAL];
}

// CloudAccount represents a cloud provider account linked to a Cofide organization.
message CloudAccount {
  // Unique identifier for the cloud account. Generated by the server, prefixed with "ca-".
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Cofide organization ID this cloud account belongs to.
  string org_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Optional cloud organization ID this account belongs to.
  optional string cloud_organization_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // Human-readable name for the cloud account.
  string name = 4 [(google.api.field_behavior) = REQUIRED];
  // Cloud provider-specific configuration.
  oneof provider {
    AWSAccount aws = 5;
  }
  // Time of resource creation.
  google.protobuf.Timestamp created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of last resource update.
  google.protobuf.Timestamp last_updated_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When true, discovery is suspended for this account and existing discovered resources are hidden from findings.
  bool suppressed = 8 [(google.api.field_behavior) = OPTIONAL];
  // When true, the existence of this CloudAccount in Connect is managed by the discovery mechanism, so if on a
  // subsequent discovery run for the parent cloud organization this account is not found it is assumed to have been
  // deleted and this resource will be deleted within Connect.
  // Set to false to manually manage existence of this resource outside of cloud organization level discovery.
  bool managed_by_discovery = 9 [(google.api.field_behavior) = OPTIONAL];
}
