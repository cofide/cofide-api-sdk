// This file defines the CloudResourceDiscoveryConfigService gRPC service for
// managing cloud resource discovery configs in the Connect control plane. A
// cloud resource discovery config configures discovery of resources, such as
// workloads, within a cloud account linked to a Cofide organization.

syntax = "proto3";

package proto.cloud_resource_discovery_config.v1alpha1;

import "google/api/field_behavior.proto";
import "proto/cloud_resource_discovery_config/v1alpha1/discovery.proto";
import "proto/common/pagination/v1beta1/pagination.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/proto/cloud_resource_discovery_config/v1alpha1";

// CloudResourceDiscoveryConfigService manages cloud resource discovery configs in the Connect control plane.
service CloudResourceDiscoveryConfigService {
  // CreateCloudResourceDiscoveryConfig creates a cloud resource discovery config within a cloud account.
  rpc CreateCloudResourceDiscoveryConfig(CreateCloudResourceDiscoveryConfigRequest) returns (CreateCloudResourceDiscoveryConfigResponse);
  // GetCloudResourceDiscoveryConfig retrieves a cloud resource discovery config by ID.
  rpc GetCloudResourceDiscoveryConfig(GetCloudResourceDiscoveryConfigRequest) returns (GetCloudResourceDiscoveryConfigResponse);
  // ListCloudResourceDiscoveryConfigs returns all cloud resource discovery configs matching the optional filter.
  rpc ListCloudResourceDiscoveryConfigs(ListCloudResourceDiscoveryConfigsRequest) returns (ListCloudResourceDiscoveryConfigsResponse);
  // UpdateCloudResourceDiscoveryConfig updates an existing cloud resource discovery config.
  rpc UpdateCloudResourceDiscoveryConfig(UpdateCloudResourceDiscoveryConfigRequest) returns (UpdateCloudResourceDiscoveryConfigResponse);
  // DeleteCloudResourceDiscoveryConfig deletes a cloud resource discovery config by ID.
  rpc DeleteCloudResourceDiscoveryConfig(DeleteCloudResourceDiscoveryConfigRequest) returns (DeleteCloudResourceDiscoveryConfigResponse);
}

message CreateCloudResourceDiscoveryConfigRequest {
  CloudResourceDiscoveryConfig cloud_resource_discovery_config = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateCloudResourceDiscoveryConfigResponse {
  CloudResourceDiscoveryConfig cloud_resource_discovery_config = 1;
}

message GetCloudResourceDiscoveryConfigRequest {
  string cloud_resource_discovery_config_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetCloudResourceDiscoveryConfigResponse {
  CloudResourceDiscoveryConfig cloud_resource_discovery_config = 1;
}

message ListCloudResourceDiscoveryConfigsRequest {
  message Filter {}
  Filter filter = 1 [(google.api.field_behavior) = OPTIONAL];
  proto.common.pagination.v1beta1.PageRequest pagination = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListCloudResourceDiscoveryConfigsResponse {
  repeated CloudResourceDiscoveryConfig cloud_resource_discovery_configs = 1;
  proto.common.pagination.v1beta1.PageResponse pagination = 2;
}

message UpdateCloudResourceDiscoveryConfigRequest {
  message AWSLambdaDiscoveryConfigUpdateMask {
    // Set to true to update the name field.
    bool name = 1 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the disabled field.
    bool disabled = 2 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the discovery_interval field.
    bool discovery_interval = 3 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the regions field.
    bool regions = 4 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the assume through OIDC field on the assume role config.
    bool assume_through_oidc = 5 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the audience field on the assume role config.
    bool audience = 6 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the roles field on the assume role config.
    bool roles = 7 [(google.api.field_behavior) = OPTIONAL];
  }
  message AWSAgentCoreDiscoveryConfigUpdateMask {
    // Set to true to update the name field.
    bool name = 1 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the disabled field.
    bool disabled = 2 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the discovery_interval field.
    bool discovery_interval = 3 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the regions field.
    bool regions = 4 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the assume through OIDC field on the assume role config.
    bool assume_through_oidc = 5 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the audience field on the assume role config.
    bool audience = 6 [(google.api.field_behavior) = OPTIONAL];
    // Set to true to update the roles field on the assume role config.
    bool roles = 7 [(google.api.field_behavior) = OPTIONAL];
  }

  CloudResourceDiscoveryConfig cloud_resource_discovery_config = 1 [(google.api.field_behavior) = REQUIRED];
  // The list of fields to be updated. If not provided a full replacement will be made.
  // The update mask should align with the type being updated.
  oneof update_mask {
    AWSLambdaDiscoveryConfigUpdateMask aws_lambda_discovery_config_update_mask = 2;
    AWSAgentCoreDiscoveryConfigUpdateMask aws_agent_core_discovery_config_update_mask = 3;
  }
}

message UpdateCloudResourceDiscoveryConfigResponse {
  CloudResourceDiscoveryConfig cloud_resource_discovery_config = 1;
}

message DeleteCloudResourceDiscoveryConfigRequest {
  string cloud_resource_discovery_config_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteCloudResourceDiscoveryConfigResponse {}
