// This file defines the Cluster message representing a single environment
// (e.g. a Kubernetes cluster) onboarded onto the Connect control plane.
syntax = "proto3";

package proto.cluster.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "proto/trust_provider/v1alpha1/trust_provider.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/proto/cluster/v1alpha1";

// Cluster represents a single environment (e.g. a Kubernetes cluster) onboarded
// onto Connect. Each cluster belongs to a trust zone.
message Cluster {
  reserved 2;
  reserved "trust_zone";

  optional string id = 8;
  optional string name = 1;
  optional string org_id = 9;

  optional string trust_zone_id = 10;
  // The kubeconfig context name used to interact with this cluster.
  optional string kubernetes_context = 3;
  // The node attestation trust provider configuration for this cluster.
  optional proto.trust_provider.v1alpha1.TrustProvider trust_provider = 4;
  // Additional Helm values to pass to the Cofide SPIRE chart deployment.
  optional google.protobuf.Struct extra_helm_values = 5;
  optional string profile = 6;
  // Whether the SPIRE server for this cluster's trust zone is deployed externally
  // (i.e. not within this cluster).
  optional bool external_server = 7;

  // OIDC issuer URL for the Kubernetes API server, used for k8s_psat node attestation.
  optional string oidc_issuer_url = 11;
  // PEM-encoded CA certificate for the OIDC issuer, if it uses a private CA.
  optional bytes oidc_issuer_ca_cert = 12;
  // Time of resource creation by user.
  google.protobuf.Timestamp created_at = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of last resource update by user.
  google.protobuf.Timestamp last_updated_at = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // external_provider carries provider-specific metadata for a cluster that
  // was discovered outside a trust zone (e.g. an AWS EKS cluster found by
  // cloud resource discovery), rather than created directly by a user. Unset
  // for clusters created through the normal onboarding flow. Presence of an
  // external_provider is the signal that trust_zone_id may legitimately be
  // empty (discovered, not yet enrolled).
  oneof external_provider {
    AWSEKSProvider aws_eks = 15;
  }

  // Whether this cluster currently matches an enabled ClusterSuppressionRule scoped to it.
  // Computed dynamically against the current rule set at query time rather than stored,
  // mirroring proto.workload.v1alpha1.Workload.suppressed. Only populated in ListClusters
  // responses.
  bool suppressed = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AWSEKSProvider carries the AWS-specific metadata for a cluster discovered
// via AWS EKS cloud resource discovery.
message AWSEKSProvider {
  string cluster_arn = 1;
  string kubernetes_version = 2;
  // The cloud account this cluster was discovered in, for traceability back
  // to the discovery source.
  string cloud_account_id = 3;
  // AWS region the cluster was discovered in.
  string region = 4;
  // AWS resource tags on this EKS cluster, as returned by eks:DescribeCluster. Used as
  // suppression-rule selectors via AWSEKSClusterMatcher.tags.
  map<string, string> tags = 5;
}
