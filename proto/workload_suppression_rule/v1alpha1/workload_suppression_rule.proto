// This file defines the WorkloadSuppressionRule message and related types used
// to hide discovered workloads from the Connect findings view. A workload is
// suppressed if it matches any enabled rule whose scope applies to it.
// Suppression is evaluated dynamically at query time by
// WorkloadService.ListWorkloads and is not persisted on the Workload itself.
syntax = "proto3";

package proto.workload_suppression_rule.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/proto/workload_suppression_rule/v1alpha1";

// WorkloadSuppressionRule defines a rule that hides matching workloads from
// the Connect findings view.
message WorkloadSuppressionRule {
  // Unique identifier for the rule. Generated by the server.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Cofide organization this rule belongs to.
  string org_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Human-readable name for the rule.
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  // Human-readable explanation of why the rule exists.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];
  // Whether the rule is currently active. Disabled rules are retained but have
  // no suppression effect.
  bool enabled = 5 [(google.api.field_behavior) = OPTIONAL];
  // Match criteria.
  oneof matcher {
    KubernetesPodMatcher kubernetes_pod = 6;
  }
  // Time of resource creation.
  google.protobuf.Timestamp created_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of last resource update.
  google.protobuf.Timestamp last_updated_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// KubernetesPodMatcher matches Kubernetes pod workloads
message KubernetesPodMatcher {
  // Matches only pods within these trust zones.
  repeated string trust_zone_ids = 1 [(google.api.field_behavior) = OPTIONAL];
  // Matches only pods within these clusters.
  repeated string cluster_ids = 2 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.workload.v1alpha1.KubernetesMetadata.namespace.
  repeated string namespaces = 3 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.workload.v1alpha1.KubernetesMetadata.labels.
  map<string, string> labels = 4 [(google.api.field_behavior) = OPTIONAL];
}
