// This file defines the WorkloadSuppressionRule message and related types used
// to hide discovered workloads from the Connect findings view. Rules can be
// scoped to an organization, a trust zone, or a single cluster; a workload is
// suppressed if it matches any enabled rule whose scope applies to it.
// Suppression is evaluated dynamically at query time by
// WorkloadService.ListWorkloads and is not persisted on the Workload itself.
syntax = "proto3";

package proto.workload_suppression_rule.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "proto/attestation_policy/v1alpha1/attestation_policy.proto";
import "proto/exchange_policy/v1alpha1/exchange_policy.proto";
import "proto/workload/v1alpha1/workload.proto";

option go_package = "github.com/cofide/cofide-api-sdk/gen/go/proto/workload_suppression_rule/v1alpha1";

// WorkloadSuppressionRule defines a rule that hides matching workloads from
// the Connect findings view. A rule scoped to only an org_id applies to every
// workload in the organization; a rule that also sets trust_zone_id and/or
// cluster_id applies only to workloads within that trust zone/cluster. The
// effective suppression for a workload is the union of every enabled rule
// whose scope applies to it — a workload is suppressed if it matches ANY of
// them.
message WorkloadSuppressionRule {
  // Unique identifier for the rule. Generated by the server, prefixed with "wsr-".
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Cofide organization this rule belongs to.
  string org_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Restricts the rule to workloads within this trust zone. Leave unset for a
  // rule that applies across all trust zones (subject to cluster_id).
  optional string trust_zone_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // Restricts the rule to workloads within this cluster. Leave unset for a
  // rule that applies across all clusters (subject to trust_zone_id).
  optional string cluster_id = 4 [(google.api.field_behavior) = OPTIONAL];
  // Human-readable name for the rule.
  string name = 5 [(google.api.field_behavior) = REQUIRED];
  // Human-readable explanation of why the rule exists.
  optional string description = 6 [(google.api.field_behavior) = OPTIONAL];
  // Whether the rule is currently active. Disabled rules are retained but have
  // no suppression effect.
  bool enabled = 7 [(google.api.field_behavior) = OPTIONAL];
  // The workload type this rule matches. Determines which arm of the `matcher`
  // oneof is populated. Mirrors proto.workload.v1alpha1.Workload.type.
  proto.workload.v1alpha1.WorkloadType workload_type = 8 [(google.api.field_behavior) = REQUIRED];
  // Match criteria, specific to workload_type.
  oneof matcher {
    KubernetesPodMatcher kubernetes_pod = 9;
    LambdaFunctionMatcher lambda_function = 12;
    AgentcoreWorkloadMatcher agentcore_workload = 13;
  }
  // Time of resource creation.
  google.protobuf.Timestamp created_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of last resource update.
  google.protobuf.Timestamp last_updated_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// KubernetesPodMatcher matches Kubernetes pod workloads
// (proto.workload.v1alpha1.KubernetesPod) by namespace and/or the pod's own
// labels. When both namespace and labels are set, a workload must satisfy
// BOTH to match (AND semantics). An unset/empty namespace matches any
// namespace; an unset labels selector matches any labels.
message KubernetesPodMatcher {
  // Matches proto.workload.v1alpha1.KubernetesMetadata.namespace. Matchers
  // within the set are evaluated with OR semantics. Unset/empty matches any
  // namespace.
  proto.exchange_policy.v1alpha1.StringSet namespace = 1 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.workload.v1alpha1.KubernetesMetadata.labels — i.e. the
  // pod's OWN labels, not the labels of the namespace object it runs in.
  // Unset/empty matches any labels.
  proto.attestation_policy.v1alpha1.APLabelSelector labels = 2 [(google.api.field_behavior) = OPTIONAL];
}

// LambdaFunctionMatcher matches AWS Lambda function workloads
// (proto.workload.v1alpha1.LambdaFunctionWorkload) by region, function name,
// and/or the AWS account the function was discovered in. When multiple
// fields are set, a workload must satisfy ALL of them to match (AND
// semantics). An unset/empty field matches anything.
message LambdaFunctionMatcher {
  // Matches proto.workload.v1alpha1.LambdaFunctionWorkload.region. Matchers
  // within the set are evaluated with OR semantics. Unset/empty matches any
  // region.
  proto.exchange_policy.v1alpha1.StringSet region = 1 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.workload.v1alpha1.LambdaFunctionWorkload.function_name.
  // Matchers within the set are evaluated with OR semantics. Unset/empty
  // matches any function name.
  proto.exchange_policy.v1alpha1.StringSet function_name = 2 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.workload.v1alpha1.LambdaFunctionWorkload.cloud_account_id.
  // Matchers within the set are evaluated with OR semantics. Unset/empty
  // matches any cloud account.
  proto.exchange_policy.v1alpha1.StringSet cloud_account_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.workload.v1alpha1.LambdaFunctionWorkload.tags. Unset/empty
  // matches any tags.
  proto.attestation_policy.v1alpha1.APLabelSelector tags = 4 [(google.api.field_behavior) = OPTIONAL];
}

// AgentcoreWorkloadMatcher matches AWS Bedrock AgentCore Runtime workloads
// (proto.workload.v1alpha1.AgentcoreWorkloadWorkload) by region, runtime name, and/or the AWS
// account it was discovered in. AND semantics across set fields, as with LambdaFunctionMatcher.
message AgentcoreWorkloadMatcher {
  // Matches proto.workload.v1alpha1.AgentcoreWorkloadWorkload.region. Matchers within the set are
  // evaluated with OR semantics. Unset/empty matches any region.
  proto.exchange_policy.v1alpha1.StringSet region = 1 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.workload.v1alpha1.AgentcoreWorkloadWorkload.agent_runtime_name. Matchers within
  // the set are evaluated with OR semantics. Unset/empty matches any runtime name.
  proto.exchange_policy.v1alpha1.StringSet agent_runtime_name = 2 [(google.api.field_behavior) = OPTIONAL];
  // Matches proto.workload.v1alpha1.AgentcoreWorkloadWorkload.cloud_account_id. Matchers within
  // the set are evaluated with OR semantics. Unset/empty matches any cloud account.
  proto.exchange_policy.v1alpha1.StringSet cloud_account_id = 3 [(google.api.field_behavior) = OPTIONAL];
}
