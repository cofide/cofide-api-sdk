name: govulncheck
on:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The action sets up Go itself. Don't set it up in an earlier step:
      # setup-go exports GOTOOLCHAIN=local, after which the action's setup-go
      # ignores the toolchain directive in go.mod and installs the older Go
      # version from the go directive.
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          repo-checkout: false
          go-version-file: go.mod
          go-version-input: ""
