# Config for Google's API linter (https://linter.aip.dev).
# Run it with --config api-linter.yaml.
- disabled_rules:
    # Cofide resources are identified by a flat, server-generated `id`, and
    # requests refer to them by `<resource>_id` fields, rather than by AIP-122
    # hierarchical resource names such as
    # organizations/{org}/trustZones/{trust_zone}. The google.api.resource
    # annotation describes those name patterns, so it does not apply here. The
    # linter treats any message with a `name` field as a resource, but in
    # Cofide APIs `name` is a human-readable display name, not a resource name.
    - core::0123::resource-annotation
    - core::0131::method-signature
    - core::0131::request-name-required
    - core::0131::request-required-fields
    - core::0131::request-unknown-fields
    - core::0133::request-id-field
    - core::0134::method-signature
    - core::0135::method-signature
    - core::0135::request-name-required
    - core::0135::request-required-fields
    - core::0135::request-unknown-fields

    # The APIs are served over ConnectRPC and gRPC, without HTTP/JSON
    # transcoding, so methods have no google.api.http annotations.
    - core::0127::http-annotation

    # Every method returns its own response message rather than the resource
    # or Empty, so fields can be added to a response later.
    - core::0131::response-message-name
    - core::0133::response-message-name
    - core::0134::response-message-name
    - core::0135::response-message-name

    # List methods take a structured Filter message rather than a filter
    # string in the AIP-160 syntax.
    - core::0132::request-field-types
    - core::0160::filter-field-type

    # List methods page with the shared PageRequest and PageResponse messages
    # from cofide.common.pagination, rather than with page_size, page_token and
    # next_page_token fields on each request and response.
    - core::0132::request-unknown-fields
    - core::0132::response-unknown-fields
    - core::0158::request-page-size-field
    - core::0158::request-page-token-field
    - core::0158::response-next-page-token-field
    - core::0215::foreign-type-reference

    # Updates take field mask messages of our own, such as AWSAccountUpdateMask,
    # rather than a google.protobuf.FieldMask. A mask message has a bool for
    # each field that can be updated, so it doesn't depend on field names in
    # strings and documents which fields are updatable.
    - core::0134::request-mask-required
    - core::0134::request-required-fields
    - core::0134::request-unknown-fields

    # Timestamps are named created_at and last_updated_at across all Cofide
    # APIs, rather than create_time and update_time.
    - core::0140::prepositions
    - core::0142::time-field-names

    # We don't publish Java stubs, so the Java file options aren't needed.
    - core::0191::java-multiple-files
    - core::0191::java-outer-classname
    - core::0191::java-package
